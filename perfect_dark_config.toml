# ---- Advanced Control (Rare's 2010 title update, re-created; HANDOVER 4co) ----------

# The smoke pool, doubled with N64 explosion durations (pd_n64_explosions), as the
# title update did (30 / 60 smokes -> 60 / 120): sub_82160E30 stores the count at
# 0x8262E2C8 and allocates count * 1612 bytes from the stage pool after it.
[[midasm_hook]]
address = 0x82160E60
name = "PdHookSmokePool"
registers = ["r11"]

# Secondary Fire Reset (pd_secondary_fire_reset, default true = the game as it was):
# the four places the game sets weapons back to their primary function (each clears
# the player's per-weapon function bits at player config +199: the whole 6-byte
# array in three of them, the current weapon's bit in the fourth). The title update
# skipped them when its "Secondary Fire Reset" option was off; so does this.
[[midasm_hook]]
address = 0x820FDAF4
name = "PdHookKeepGunFunctions"
jump_address_on_true = 0x820FDB00

[[midasm_hook]]
address = 0x82107024
name = "PdHookKeepGunFunctions"
jump_address_on_true = 0x8210706C

[[midasm_hook]]
address = 0x82172BFC
name = "PdHookKeepGunFunctions"
jump_address_on_true = 0x82172C08

[[midasm_hook]]
address = 0x821817C4
name = "PdHookKeepGunFunctions"
jump_address_on_true = 0x821817D0

# Aim Sensitivity (pd_aim_sensitivity, default -1 = 1.3's fixed factor): the aiming look
# speed's 0.25 / 0.5 (Farsight) factor, in sub_820F1EA8 and the main control function,
# becomes the title update's sens / 255 * 0.12 + 0.2 (Farsight * 0.2 + 0.4).
[[midasm_hook]]
address = 0x820F1F54
name = "PdHookAimSensitivity"
registers = ["r3", "f0"]

[[midasm_hook]]
address = 0x820F4A20
name = "PdHookAimSensitivity"
registers = ["r3", "f0"]

