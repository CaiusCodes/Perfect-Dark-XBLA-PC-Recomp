# Perfect Dark XBLA PC Recomp: the port's changes to the game's code, as codegen hooks.
#
# The recompiled code in generated/ is made from the player's own default.xex and is
# never committed, so every change to the game's behaviour is a hook here: ReXGlue's
# codegen inserts a call at the given guest address, and the function lives in
# src/perfect_dark_hooks.cpp. A hook runs before the instruction at `address`
# (after it with after_instruction = true); the registers listed are passed by
# reference; `return`, `return_on_true` and `jump_address(_on_true)` end the guest
# function or branch after the call. HANDOVER.md has the history of each change.

# ---- Start-up -----------------------------------------------------------------------

# No Xbox LIVE Arcade logo while the game loads (pd_skip_arcade_logo): its three draws
# (sub_82332DF0) are skipped; the loading loop around them is untouched.
[[midasm_hook]]
address = 0x822512DC
name = "PdHookSkipArcadeLogo"
jump_address_on_true = 0x822512E0

[[midasm_hook]]
address = 0x822515B0
name = "PdHookSkipArcadeLogo"
jump_address_on_true = 0x822515B4

[[midasm_hook]]
address = 0x82251670
name = "PdHookSkipArcadeLogo"
jump_address_on_true = 0x82251674

# Product Identification screen length (pd_legal_screen_ticks): titleTickLegal's
# `cmpwi cr6,r11,180` compares with the setting instead.
[[midasm_hook]]
address = 0x8224A444
name = "PdHookLegalScreenCompare"
registers = ["r11", "cr6", "xer"]
after_instruction = true

# ---- Game clock and CPU use ---------------------------------------------------------

# osGetCount (sub_8224FB60), once a frame: the stutter log's game steps, and the
# smoothed frame step (pd_smooth_game_clock) that keeps the clock from running fast.
[[midasm_hook]]
address = 0x8224FC18
name = "PdHookOsGetCount"
registers = ["r9", "r10", "r11"]
after_instruction = true
jump_address_on_true = 0x8224FC44

# The game's timer at the real guest tick rate (pd_exact_timer): seconds,
# milliseconds and microseconds (sub_822B7700 / 7750 / 7790).
[[midasm_hook]]
address = 0x822B7724
name = "PdHookTimerR3FromR9"
registers = ["r3", "r9"]
after_instruction = true

[[midasm_hook]]
address = 0x822B7778
name = "PdHookTimerR7FromR9"
registers = ["r7", "r9"]
after_instruction = true

[[midasm_hook]]
address = 0x822B77B4
name = "PdHookTimerR3FromR10"
registers = ["r3", "r10"]
after_instruction = true

# GPU-completion poll (sub_82329E08): yield, then sleep 0.5 ms while still waiting
# (pd_sleep_in_waits).
[[midasm_hook]]
address = 0x82329EB4
name = "PdHookGpuWaitBackoff"
after_instruction = true

# Sleep(0) in the 10 ms timer thread and its worker (sub_8226D308, sub_8226D520):
# a 0.5 ms sleep instead (pd_sleep_in_waits).
[[midasm_hook]]
address = 0x8226D368
name = "PdHookIdleSleep"
registers = ["r3"]
jump_address_on_true = 0x8226D36C

[[midasm_hook]]
address = 0x8226D588
name = "PdHookIdleSleep"
registers = ["r3"]
jump_address_on_true = 0x8226D58C

